[package]
name = "mac-voice-mix"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"

[lib]
name = "mac_voice_mix_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
